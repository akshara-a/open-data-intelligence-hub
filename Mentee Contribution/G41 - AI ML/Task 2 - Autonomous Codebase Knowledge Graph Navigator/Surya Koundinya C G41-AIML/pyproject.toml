[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgnav"
version = "1.0.0"
description = "Autonomous Codebase Knowledge Graph Navigator (Neo4j + MCP + LLM agent)"
requires-python = ">=3.10"
dependencies = [
  "neo4j>=5.20",
  "mcp>=1.2.0,<2.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kgnav = "kgnav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
