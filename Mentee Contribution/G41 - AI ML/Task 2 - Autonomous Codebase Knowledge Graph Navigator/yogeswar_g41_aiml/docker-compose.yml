version: "3.9"

networks:
  ingress_net:
    driver: bridge
  app_net:
    driver: bridge
  mcp_net:
    internal: true
  db_net:
    internal: true

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  internal_service_key:
    file: ./secrets/internal_service_key.pem
  internal_service_pubkey:
    file: ./secrets/internal_service_pubkey.pem
  neo4j_admin_password:
    file: ./secrets/neo4j_admin.password
  neo4j_read_password:
    file: ./secrets/neo4j_read.password
  neo4j_write_password:
    file: ./secrets/neo4j_write.password
  admin_password:
    file: ./secrets/admin.password

volumes:
  neo4j_data:
  shared_sqlite_data:
  shared_git_storage:

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ingress_net
      - app_net
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SQLITE_DB_PATH=/app/data/app_state.db
      - MCP_SERVICE_URL=http://mcp:8000
      - RAG_SERVICE_URL=http://rag:8000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
    secrets:
      - jwt_private_key
      - jwt_public_key
      - internal_service_key
      - admin_password
    volumes:
      - shared_sqlite_data:/app/data
      - ./backend/app:/app/app:ro
    networks:
      - app_net
      - mcp_net
    depends_on:
      - mcp
      - rag

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    environment:
      - NEO4J_BOLT_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_admin_password
      - GIT_STORAGE_ROOT=/app/git_storage
    secrets:
      - neo4j_admin_password
      - internal_service_pubkey
    volumes:
      - shared_git_storage:/app/git_storage:ro
    networks:
      - mcp_net
      - db_net
    depends_on:
      neo4j:
        condition: service_healthy

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    environment:
      - SQLITE_DB_PATH=/app/data/app_state.db
      - NEO4J_BOLT_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD_FILE=/run/secrets/neo4j_admin_password
      - GIT_STORAGE_ROOT=/app/git_storage
      - PYTHONUNBUFFERED=1
      - ALLOW_LOCAL_GIT=1
    secrets:
      - neo4j_admin_password
    volumes:
      - shared_sqlite_data:/app/data
      - shared_git_storage:/app/git_storage
    networks:
      - app_net
      - db_net
    depends_on:
      neo4j:
        condition: service_healthy

  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    environment:
      - SQLITE_DB_PATH=/app/data/app_state.db
      - MCP_SERVICE_URL=http://mcp:8000
      - GIT_STORAGE_ROOT=/app/git_storage
    secrets:
      - internal_service_key
    volumes:
      - shared_sqlite_data:/app/data
      - shared_git_storage:/app/git_storage:ro
    networks:
      - app_net
      - mcp_net
    depends_on:
      - mcp

  neo4j:
    image: neo4j:5.18-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    entrypoint:
      - "bash"
      - "-c"
      - |
        export NEO4J_AUTH="neo4j/$$(sed -e 's/[[:cntrl:]]//g' /run/secrets/neo4j_admin_password)"
        exec /startup/docker-entrypoint.sh neo4j
    environment:
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_auth__minimum__password__length=12
    secrets:
      - neo4j_admin_password
    volumes:
      - neo4j_data:/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$(sed -e 's/[[:cntrl:]]//g' /run/secrets/neo4j_admin_password) 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
